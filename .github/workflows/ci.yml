name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The app's tests use embedded PGlite; this proves the SQL migrations also apply
      # to real Postgres, and that re-running them is a no-op.
      - name: Migrations on real Postgres (twice)
        run: npm run db:migrate && npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
